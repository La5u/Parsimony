[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parsimony-benchmark"
version = "0.5.1b0"
description = "Correctness-gated static code footprint benchmarking for SWE-bench submissions"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
parsimony = "parsimony.__main__:main"

[tool.setuptools.packages.find]
include = ["parsimony*"]
