[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parsimony-benchmark"
version = "0.6.0b0"
description = "Correctness-gated static code footprint benchmarking for SWE-bench submissions"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
languages = [
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
]

[project.scripts]
parsimony = "parsimony.__main__:main"

[tool.setuptools.packages.find]
include = ["parsimony*"]
