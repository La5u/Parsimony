[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parsimony-benchmark"
version = "0.7.0b0"
description = "Correctness-gated static code footprint benchmarking for SWE-bench submissions"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Go. JavaScript/TypeScript use Node.js plus the npm pin in package.json (`npm ci`).
languages = [
    "tree-sitter==0.26.0",
    "tree-sitter-go==0.25.0",
]

[project.scripts]
parsimony = "parsimony.__main__:main"

[tool.setuptools.packages.find]
include = ["parsimony*"]

[tool.setuptools.package-data]
parsimony = ["*.cjs"]
