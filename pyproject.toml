[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parsimony-benchmark"
version = "0.8.0b0"
description = "Correctness-gated static code footprint benchmarking for SWE-bench submissions"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Go. JavaScript/TypeScript use Node.js plus the npm pin in package.json (`npm ci`).
languages = [
    "tree-sitter==0.26.0",
    "tree-sitter-go @ https://codeload.github.com/nvlbg/tree-sitter-go/tar.gz/5a6af13a0a5b45bc76cac289c783b315b2b74e13#sha256=3b0b0a55c6c8cd6671d813989b1f53af687c3b8afde3fb986ef767acbde0a017",
]

[project.scripts]
parsimony = "parsimony.__main__:main"

[tool.setuptools.packages.find]
include = ["parsimony*"]

[tool.setuptools.package-data]
parsimony = ["*.cjs"]
