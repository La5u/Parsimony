[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parsimony-benchmark"
version = "0.9.0b0"
description = "Correctness-gated static code footprint benchmarking for SWE-bench submissions"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# Go. JavaScript/TypeScript use Node.js plus the npm pin in package.json (`npm ci`).
languages = [
    "tree-sitter==0.26.0",
    "tree-sitter-go @ https://codeload.github.com/botanica-consulting/tree-sitter-go/tar.gz/97cacdcb9e1e699f7b3dfed21386da60ed6e63cd#sha256=c653dd381ce89f883393f6d4db7aa1f27772dad79cc932c0f3aff5b15dc9b588",
]

[project.scripts]
parsimony = "parsimony.__main__:main"

[tool.setuptools.packages.find]
include = ["parsimony*"]

[tool.setuptools.package-data]
parsimony = ["*.cjs"]
