name: Question the method
description: A counting rule, scope rule or ranking choice seems unfair or wrong.
title: "Method: <short summary>"
labels: [method]
body:
  - type: textarea
    id: critique
    attributes:
      label: What is wrong with the method
      description: >
        Which rule, and why. An example where two patches get the wrong order is the most convincing.
        Existing cases are in docs/adversarial-validation.md.
    validations:
      required: true
