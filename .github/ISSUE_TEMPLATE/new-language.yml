name: Add a language
description: Propose or volunteer for an analyzer for a new language (e.g. Java, Rust).
title: "Language: <language>"
labels: [language]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark with public patches (optional)
      description: Which benchmark publishes per-attempt patches in this language.
  - type: checkboxes
    id: help
    attributes:
      label: Help
      options:
        - label: I'd like to work on this. See docs/language-tracks.md.
